/**:
  ros__parameters:
    use_sim_time: true
    frames/odom: map
    frames/baselink: base_link
    frames/lidar: livox_frame
    frames/imu: odom

    # Lidar message type: "standard" (sensor_msgs/PointCloud2) or "livox" (CustomMsg)
    lidar_driver: "standard"

    map/waitUntilMove: false
    map/dense/filtered: true
    map/sparse/leafSize: 0.25

    odom/gravity: 9.80665
    odom/computeTimeOffset: true

    odom/imu/approximateGravity: true
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 5000

    odom/preprocessing/cropBoxFilter/size: 1.0
    odom/preprocessing/voxelFilter/res: 0.25

    odom/keyframe/threshD: 4.0
    odom/keyframe/threshR: 45.0

    odom/submap/keyframe/knn: 10
    odom/submap/keyframe/kcv: 10
    odom/submap/keyframe/kcc: 10
    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 0.5
    odom/gicp/maxIterations: 32
    odom/gicp/transformationEpsilon: 0.01
    odom/gicp/rotationEpsilon: 0.01
    odom/gicp/requireConverged: false
    odom/gicp/minInliers: 0
    odom/gicp/maxError: -1.0
    odom/gicp/rejectLargeCorrection: false
    odom/gicp/maxCorrectionTranslation: 1.0
    odom/gicp/maxCorrectionRotationDeg: 20.0

    odom/geo/Kp: 4.5
    odom/geo/Kv: 11.25
    odom/geo/Kq: 4.0
    odom/geo/Kab: 2.25
    odom/geo/Kgb: 1.0
    odom/geo/abias_max: 10.0
    odom/geo/gbias_max: 0.5

    odom/occupancy/enable: false
    odom/occupancy/use_dynamic_map: false
    odom/occupancy/map_resolution: 0.1
    odom/occupancy/min_z: 0.0
    odom/occupancy/max_z: 2.0
